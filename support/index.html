<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support</title>
<link rel="canonical" href="https://support.productive-lab.com/">
<noscript><meta http-equiv="refresh" content="0; url=https://support.productive-lab.com/"></noscript>
<p>Opening <a id="to" href="https://support.productive-lab.com/">Support</a>…</p>
<script>
  var target = new URL("https://support.productive-lab.com/");
  new URLSearchParams(location.search).forEach(function (value, key) {
    if (!target.searchParams.has(key)) target.searchParams.set(key, value);
  });
  document.getElementById('to').href = target.href;
  location.replace(target.href);
</script>
</html>
